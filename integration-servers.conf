# Shared engine matrix for setup-integration-servers.sh, test.sh, and Rust test-server selection.
# Format: directory|repository|branch|features
# directory is in tmp/integration-servers
# Features are comma-separated, with the primary compatibility feature first.
# Order rows oldest to newest. Direct Cargo runs first exclude Redis rows unless
# use-redismodule-api is enabled; Valkey rows support either API mode. Among the
# remaining rows, select the last whose primary feature is enabled, falling back
# to the first eligible row if none match. Default features thus select Valkey 7.2.
# INTEGRATION_TEST_SERVER overrides selection with a directory name from this file;
# test.sh sets it per row so versions can share features and still run separately.
# Redis overrides are rejected before startup unless use-redismodule-api is enabled.
# Executables: tmp/integration-servers/<directory>/src/<engine>-server,
# where <engine> is the directory prefix before '-'.
# To add a version, add a row and rerun setup-integration-servers.sh. Define any new
# compatibility feature in Cargo.toml first; existing features can be reused.
redis-7.0|https://github.com/redis/redis.git|7.0|min-redis-compatibility-version-7-0,use-redismodule-api
valkey-7.2|https://github.com/valkey-io/valkey.git|7.2|min-redis-compatibility-version-7-2
valkey-8.1|https://github.com/valkey-io/valkey.git|8.1|min-valkey-compatibility-version-8-0,min-redis-compatibility-version-7-2
valkey-9.1|https://github.com/valkey-io/valkey.git|9.1|min-valkey-compatibility-version-9-0,min-valkey-compatibility-version-8-0,min-redis-compatibility-version-7-2
